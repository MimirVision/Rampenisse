<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3f">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rampenisse-verkstedet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: en julekalender med 24 luker er hjertet; resten er verktøy rundt den. Mobil: bunnmeny. Desktop: toppmeny + bredere kort. */
:root {
  --snow: #f4f7f5;          /* bakgrunn: snøhvit med grantone */
  --paper: #ffffff;         /* kort */
  --ink: #17302a;           /* tekst: mørk gran */
  --muted: #5b6f69;
  --line: #d9e2de;
  --spruce: #1f4d3f;        /* primær grønn */
  --spruce-soft: #e3eee9;
  --berry: #b3263a;         /* tyttebær-rød aksent */
  --berry-soft: #f8e4e6;
  --gold: #c99a2e;          /* stearinlys-gull */
  --gold-soft: #fbf1d8;
  --bar: #1f4d3f;           /* toppstripe */
  --door: #24584a;          /* lukket luke */
  --door-ink: #f4f7f5;
  --ok: #2f7a4b; --ok-soft: #e1f1e6;
  --warn: #a46a07; --warn-soft: #fbefd6;
  --shadow: 0 1px 2px rgba(23,48,42,.06), 0 6px 20px rgba(23,48,42,.07);
  --f-display: "Berkshire Swash", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Bradley Hand", "Comic Sans MS", cursive;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --snow: #0e1a1f; --paper: #15252b; --ink: #e9f0ec; --muted: #9fb2ab; --line: #263a40;
  --spruce: #7cc3a5; --spruce-soft: #1b3330; --berry: #f0697a; --berry-soft: #3a1d24;
  --gold: #e8bf5c; --gold-soft: #3a3020; --bar: #143a31; --door: #1d3d37; --door-ink: #e9f0ec;
  --ok: #6fcf93; --ok-soft: #173326; --warn: #f0b850; --warn-soft: #3a2e17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --snow: #0e1a1f; --paper: #15252b; --ink: #e9f0ec; --muted: #9fb2ab; --line: #263a40;
  --spruce: #7cc3a5; --spruce-soft: #1b3330; --berry: #f0697a; --berry-soft: #3a1d24;
  --gold: #e8bf5c; --gold-soft: #3a3020; --bar: #143a31; --door: #1d3d37; --door-ink: #e9f0ec;
  --ok: #6fcf93; --ok-soft: #173326; --warn: #f0b850; --warn-soft: #3a2e17;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--snow); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
#snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.75rem; color: var(--spruce); }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
a { color: var(--berry); }

/* Topp */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: #f4f7f5; }
.top-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-family: var(--f-display); font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-nav { display: none; gap: 2px; margin-left: auto; }
.top-nav a { color: #e6efe9; text-decoration: none; padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: .92rem; }
.top-nav a[aria-current="page"] { background: rgba(255,255,255,.16); color: #fff; }
.top-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.sync { font-size: .75rem; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.14); white-space: nowrap; }
.icon-btn { background: transparent; border: 0; color: inherit; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: rgba(255,255,255,.14); }
.icon-btn svg { width: 22px; height: 22px; }

/* Bunnmeny */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(6, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 600; }
.bottom-nav a svg { width: 22px; height: 22px; }
.bottom-nav a[aria-current="page"] { color: var(--berry); }
@media (min-width: 860px) { .top-nav { display: flex; } .top-actions { margin-left: 8px; } .bottom-nav { display: none; } main { padding-bottom: 48px !important; } }

main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding-top: 20px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; gap: 18px; }
.view-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between; }
.view-head p { color: var(--muted); max-width: 60ch; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.grid-2 { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid-2 { grid-template-columns: 1fr 1fr; } .grid-2.wide-left { grid-template-columns: 1.4fr 1fr; } }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 8px 14px; border-radius: 999px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: .92rem; line-height: 1.2; }
.btn:hover { border-color: var(--spruce); }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--berry); border-color: var(--berry); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #1a0d10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1a0d10; } }
.btn.green { background: var(--spruce); border-color: var(--spruce); color: var(--snow); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--spruce-soft); }
.btn.sm { padding: 5px 10px; font-size: .82rem; }
.btn.danger { color: var(--berry); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--spruce-soft); color: var(--spruce); white-space: nowrap; }
.chip.berry { background: var(--berry-soft); color: var(--berry); }
.chip.gold { background: var(--gold-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.chip-toggle { cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 5px 11px; font-size: .82rem; }
.chip-toggle[aria-pressed="true"] { background: var(--spruce); color: var(--snow); border-color: var(--spruce); }

.dots { display: inline-flex; gap: 2px; vertical-align: middle; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.dots.effort i.on { background: var(--spruce); }
.dots.mess i.on { background: var(--berry); }

/* Hero / nedtelling */
.hero { position: relative; overflow: hidden; background: var(--spruce); color: #f4f7f5; border-radius: 20px; padding: 22px; display: grid; gap: 14px; }
:root[data-theme="dark"] .hero { background: #183a32; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { background: #183a32; } }
.hero .eyebrow { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; opacity: .8; }
.hero-big { font-family: var(--f-display); font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; }
.hero-sub { opacity: .88; max-width: 52ch; }
.hero .btn { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; }
.hero .btn.primary { background: var(--gold); border-color: var(--gold); color: #2a1e05; }
.hero-hat { position: absolute; right: -10px; bottom: -16px; width: 150px; opacity: .95; pointer-events: none; }
@media (max-width: 520px) { .hero-hat { width: 96px; opacity: .5; } }
.progress { height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; max-width: 420px; }
.progress span { display: block; height: 100%; background: var(--gold); border-radius: 99px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; color: var(--spruce); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); font-weight: 600; }

.today-card { border-left: 0; display: grid; gap: 10px; }
.today-card .t-title { font-family: var(--f-display); font-size: 1.5rem; color: var(--berry); line-height: 1.15; }
.list { display: grid; gap: 0; }
.list > * { padding: 10px 0; border-top: 1px solid var(--line); }
.list > *:first-child { border-top: 0; padding-top: 0; }
.mini-day { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; cursor: pointer; background: none; border: 0; text-align: left; width: 100%; color: inherit; }
.mini-num { width: 44px; height: 44px; border-radius: 10px; background: var(--door); color: var(--door-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.3rem; }
.mini-day .mt { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--spruce); margin-top: 1px; flex: none; }
.check.done span { text-decoration: line-through; color: var(--muted); }

/* Kalender-luker */
.calendar { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
@media (max-width: 520px) { .calendar { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } }
.door { position: relative; aspect-ratio: 1 / 1.08; max-width: 100%; border-radius: 12px; border: 0; padding: 10px; cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: space-between; background: var(--door); color: var(--door-ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), var(--shadow); overflow: hidden; transition: transform .15s ease; }
.door:hover { transform: translateY(-2px); }
.door::after { content: ""; position: absolute; inset: 6px; border: 1.5px dashed rgba(255,255,255,.22); border-radius: 8px; pointer-events: none; }
.door .num { font-family: var(--f-display); font-size: 2.2rem; line-height: 1; }
.door .wd { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; opacity: .75; font-weight: 700; }
.door .dt { font-size: .8rem; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; position: relative; z-index: 1; }
.door .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; position: relative; z-index: 1; }
.door .badge { font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: rgba(255,255,255,.18); white-space: nowrap; }
.door.s-tom { background: var(--paper); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.door.s-tom::after { border-color: var(--line); }
.door.s-tom .num { color: var(--line); }
:root[data-theme="dark"] .door.s-tom .num { color: #35505a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .door.s-tom .num { color: #35505a; } }
.door.s-klar { background: #8a5d0d; }
.door.s-utfort { background: var(--berry); color: #fff; }
.door.s-hoppet { background: #6b7a76; }
.door.weekend .wd { color: var(--gold); opacity: 1; }
.door.s-utfort .wd, .door.s-klar .wd { color: inherit; }
.door.is-today { outline: 3px solid var(--gold); outline-offset: 2px; }
.door .ph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .28; }
@media (max-width: 520px) { .door { padding: 7px; } .door .num { font-size: 1.6rem; } .door .dt { font-size: .7rem; -webkit-line-clamp: 2; } .door .badge { display: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

/* Ideer */
.toolbar { display: grid; gap: 10px; }
.search { width: 100%; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
@media (max-width: 400px) { .ideas { grid-template-columns: 1fr; } }
.idea { display: grid; gap: 8px; grid-template-rows: auto auto 1fr auto; }
.idea h3 { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.idea .desc { color: var(--muted); font-size: .9rem; }
.idea .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .78rem; color: var(--muted); align-items: center; }
.fav { background: none; border: 0; cursor: pointer; color: var(--line); padding: 0; width: 28px; height: 28px; flex: none; display: grid; place-items: center; }
.fav svg { width: 22px; height: 22px; }
.fav[aria-pressed="true"] { color: var(--gold); }
.used-in { font-size: .75rem; color: var(--ok); font-weight: 600; }

/* Skjema */
.field { display: grid; gap: 5px; }
.field > span { font-size: .8rem; font-weight: 700; color: var(--muted); }
.input, textarea.input, select.input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--snow); color: var(--ink); }
textarea.input { min-height: 80px; resize: vertical; }
.form-grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.stars { display: inline-flex; gap: 2px; }
.stars button { background: none; border: 0; cursor: pointer; color: var(--line); padding: 2px; }
.stars button svg { width: 26px; height: 26px; }
.stars button.on { color: var(--gold); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--spruce-soft); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; display: grid; place-items: center; }
.upload { border: 1.5px dashed var(--line); border-radius: 10px; display: grid; place-items: center; aspect-ratio: 1; cursor: pointer; color: var(--muted); font-size: .8rem; text-align: center; padding: 6px; }
.upload input { display: none; }

/* Modal */
.modal-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(8,20,18,.55); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .modal-wrap { align-items: center; padding: 24px; } }
.modal { background: var(--paper); width: 100%; max-width: 720px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px; grid-auto-rows: max-content; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
@media (min-width: 700px) { .modal { border-radius: 20px; } }
.modal-head { display: flex; gap: 12px; align-items: center; }
.modal-head .mini-num { width: 52px; height: 52px; font-size: 1.6rem; }
.modal-head h2 { font-size: 1.5rem; }
.modal-close { margin-left: auto; background: var(--spruce-soft); color: var(--spruce); }
.modal-close:hover { background: var(--line); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 8px 12px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--berry); border-bottom-color: var(--berry); }
.sticky-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--paper); padding: 12px 0 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.pick-list { display: grid; gap: 6px; max-height: 320px; overflow: auto; }
.pick { text-align: left; border: 1px solid var(--line); background: var(--snow); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; }
.pick:hover { border-color: var(--spruce); }
.pick b { font-weight: 600; }

/* Dagbok */
.journal { display: grid; gap: 14px; }
.entry { display: grid; grid-template-columns: 64px 1fr; gap: 14px; }
.entry .mini-num { width: 64px; height: 64px; font-size: 1.9rem; background: var(--berry); color: #fff; }
.entry .quote { font-family: var(--f-hand); font-size: 1.35rem; line-height: 1.25; color: var(--spruce); }
.entry .photos { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
@media (max-width: 520px) { .entry { grid-template-columns: 1fr; } }

/* Handleliste */
.shop-item { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.shop-days { font-size: .75rem; color: var(--muted); }

/* Brev */
.letter { background: #fffaf0; color: #2b2116; border-radius: 6px; padding: 28px 26px; font-family: var(--f-hand); font-size: 1.5rem; line-height: 1.35; white-space: pre-wrap; box-shadow: var(--shadow); position: relative; border: 1px solid #eadfc8; min-height: 300px; overflow-wrap: anywhere; }
.letter::before { content: ""; position: absolute; inset: 10px; border: 2px solid #c8312f; border-radius: 3px; pointer-events: none; opacity: .5; }
.letter .sig { display: block; margin-top: 14px; color: #c8312f; font-weight: 700; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--snow); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
@media (min-width: 860px) { .toast { bottom: 28px; } }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 64px; height: 64px; color: var(--line); }
.callout { background: var(--gold-soft); border: 1px solid transparent; border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.callout.green { background: var(--spruce-soft); }
.tip-list { display: grid; gap: 12px; counter-reset: tip; }
.tip-list li { list-style: none; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.tip-list li::before { counter-increment: tip; content: counter(tip); width: 28px; height: 28px; border-radius: 50%; background: var(--berry-soft); color: var(--berry); font-weight: 700; display: grid; place-items: center; font-size: .85rem; }

/* ===================== Tilstand og lagring ===================== */
const LS_KEY = 'rampenisse-v1';
const LS_PREF = 'rampenisse-prefs';
function defaultYear() { const n = new Date(); return (n.getMonth() === 11 && n.getDate() > 25) ? n.getFullYear() + 1 : n.getFullYear(); }
function defaultSettings() { const y = defaultYear(); return { nisseName: 'Rampenissen', kids: [], startDate: `${y}-12-01`, endDate: `${y}-12-24`, reminderTime: '21:30', notes: '' }; }
function defaultExtra() { return { customIdeas: [], favorites: [], shopCustom: [], shopChecked: {}, prepChecked: {} }; }

const S = { settings: defaultSettings(), extra: defaultExtra(), days: {} };
let mode = 'local'; let DB = null; let ASSETS = null; let DOWNLOADS = null;
let prefs = { snow: true };

function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* full or blocked */ } }
function loadLocal() {
  const d = lsGet(LS_KEY);
  if (d) { S.settings = { ...defaultSettings(), ...(d.settings || {}) }; S.extra = { ...defaultExtra(), ...(d.extra || {}) }; S.days = d.days || {}; }
  prefs = { ...prefs, ...(lsGet(LS_PREF) || {}) };
}
function mirrorLocal() { lsSet(LS_KEY, { settings: S.settings, extra: S.extra, days: S.days }); }

// Én skriving om gangen per dokument, siste verdi vinner
const pending = new Map(); const inflight = new Set();
function writeDoc(path, data) {
  mirrorLocal();
  if (mode !== 'db') return;
  pending.set(path, data); flush(path);
}
async function flush(path) {
  if (inflight.has(path)) return;
  while (pending.has(path)) {
    const op = pending.get(path); pending.delete(path); inflight.add(path);
    try { if (op === null) await DB.doc(path).delete(); else await DB.doc(path).set(JSON.parse(JSON.stringify(op))); setSync('cloud'); }
    catch (e) { setSync('error', e); }
    inflight.delete(path);
  }
}
const saveSettings = () => writeDoc('app/settings', S.settings);
const saveExtra = () => writeDoc('app/extra', S.extra);
const dayKey = (n) => 'd' + String(n).padStart(2, '0');
function saveDay(n) { const k = dayKey(n); const d = S.days[k]; writeDoc('days/' + k, d && Object.keys(d).length ? d : null); }

function setSync(state, err) {
  const el = document.getElementById('sync');
  if (state === 'cloud') { el.textContent = 'Lagret i skyen'; el.title = 'Planen lagres i skyen og er lik på alle enhetene dine.'; }
  else if (state === 'loading') { el.textContent = 'Kobler til…'; }
  else if (state === 'error') { el.textContent = 'Lagret lokalt'; el.title = 'Fikk ikke lagret i skyen. Endringene ligger på denne enheten.'; if (err) console.warn(err); }
  else { el.textContent = 'Lagret lokalt'; el.title = 'Planen lagres i nettleseren på denne enheten. Ta sikkerhetskopi under Oppsett.'; }
}

async function connectCloud() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  setSync('loading');
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  try { ASSETS = await window.claude.use('assets'); } catch (e) { ASSETS = null; }
  try { DOWNLOADS = await window.claude.use('downloads'); } catch (e) { DOWNLOADS = null; }
  if (!db) { setSync('local'); return; }
  DB = db;
  const localSnapshot = { settings: { ...S.settings }, extra: { ...S.extra }, days: { ...S.days } };
  let gotApp = false, gotDays = false, migrated = false;
  const timer = setTimeout(() => { if (!gotApp || !gotDays) { setSync('error'); toast('Får ikke kontakt med skylagringen. Du kan jobbe videre, det lagres lokalt.'); } }, 10000);
  const maybeMigrate = (appEmpty, daysEmpty) => {
    if (migrated || !gotApp || !gotDays) return; migrated = true; clearTimeout(timer);
    mode = 'db'; setSync('cloud');
    const hasLocal = Object.keys(localSnapshot.days).length || localSnapshot.settings.kids.length || localSnapshot.extra.customIdeas.length;
    if (appEmpty && daysEmpty && hasLocal) {
      S.settings = localSnapshot.settings; S.extra = localSnapshot.extra; S.days = localSnapshot.days;
      saveSettings(); saveExtra(); Object.keys(S.days).forEach(k => saveDay(+k.slice(1)));
      toast('Planen din er flyttet til skyen.');
    }
    render();
  };
  let appEmpty = true, daysEmpty = true;
  DB.collection('app').onSnapshot((snap) => {
    snap.docs.forEach(d => {
      if (d.id === 'settings') S.settings = { ...defaultSettings(), ...JSON.parse(JSON.stringify(d.data())) };
      if (d.id === 'extra') S.extra = { ...defaultExtra(), ...JSON.parse(JSON.stringify(d.data())) };
    });
    if (!snap.metadata.fromCache) { if (!gotApp) appEmpty = snap.empty; gotApp = true; }
    if (migrated) { mirrorLocal(); renderSoft(); } else maybeMigrate(appEmpty, daysEmpty);
  }, (e) => { clearTimeout(timer); setSync('error', e); });
  DB.collection('days').onSnapshot((snap) => {
    if (migrated || !snap.empty) { const next = {}; snap.docs.forEach(d => { next[d.id] = JSON.parse(JSON.stringify(d.data())); }); if (migrated || !snap.metadata.fromCache) S.days = next; }
    if (!snap.metadata.fromCache) { if (!gotDays) daysEmpty = snap.empty; gotDays = true; }
    if (migrated) { mirrorLocal(); renderSoft(); } else maybeMigrate(appEmpty, daysEmpty);
  }, (e) => { clearTimeout(timer); setSync('error', e); });
}

/* ===================== Hjelpere ===================== */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const WD = ['søn', 'man', 'tir', 'ons', 'tor', 'fre', 'lør'];
const WD_LONG = ['søndag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag'];
const MONTHS = ['januar', 'februar', 'mars', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'desember'];
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function today0() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function totalDays() { const a = parseDate(S.settings.startDate), b = parseDate(S.settings.endDate); const n = Math.round((b - a) / 864e5) + 1; return Math.max(1, Math.min(40, n || 24)); }
function dateOf(n) { const d = parseDate(S.settings.startDate); d.setDate(d.getDate() + n - 1); return d; }
function dayNumberToday() { return Math.round((today0() - parseDate(S.settings.startDate)) / 864e5) + 1; }
function fmtDate(d) { return `${WD_LONG[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`; }
function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
function kidsText() { const k = S.settings.kids.filter(Boolean); if (!k.length) return 'kjære barn'; if (k.length === 1) return k[0]; return k.slice(0, -1).join(', ') + ' og ' + k[k.length - 1]; }
function getDay(n) { return S.days[dayKey(n)] || {}; }
function dayStatus(d) { if (d.status) return d.status; return d.title ? 'planlagt' : 'tom'; }
const STATUS = { tom: 'Ikke planlagt', planlagt: 'Planlagt', klar: 'Klar', utfort: 'Utført', hoppet: 'Hoppet over' };
function allIdeas() { return [...IDEAS, ...(S.extra.customIdeas || []).map(i => ({ ...i, custom: true }))]; }
function ideaById(id) { return IDEA_BY_ID[id] || (S.extra.customIdeas || []).find(i => i.id === id); }
function dots(n, cls) { return `<span class="dots ${cls}" aria-label="${n} av 3">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; }
function photoSrc(p) { return p.data || p.url || (p.id ? '/_blob/' + p.id : ''); }
function toast(msg) { const r = $('#toastRoot'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = '', 2800); }
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('Kopiert'); }
  catch (e) { if (el) { el.focus(); el.select && el.select(); } toast('Marker teksten og kopier manuelt'); }
}
function inTopFrame() { try { return window.self === window.top; } catch (e) { return false; } }

function counts() {
  const N = totalDays(); const c = { tom: 0, planlagt: 0, klar: 0, utfort: 0, hoppet: 0 };
  for (let i = 1; i <= N; i++) c[dayStatus(getDay(i))]++;
  return c;
}
function miniDay(n) {
  const d = getDay(n), st = dayStatus(d), dt = dateOf(n);

}
VIEWS.oversikt = () => {
  const N = totalDays(), dn = dayNumberToday(), c = counts();
  const name = esc(S.settings.nisseName || 'Rampenissen');

    const pct = Math.round(((c.utfort + c.hoppet) / N) * 100);
    hero = `<div class="eyebrow">Dag ${dn} av ${N} · ${fmtDate(today0())}</div>
      <div class="hero-big">${name} er på plass</div>
      <p class="hero-sub">${c.utfort} rampestreker utført så langt. ${N - dn} ${N - dn === 1 ? 'dag' : 'dager'} igjen til nissen reiser hjem.</p>
      <div class="progress" aria-label="${pct} prosent ferdig"><span style="width:${pct}%"></span></div>`;
  } else {
    hero = `<div class="eyebrow">Sesongen er over</div>
      <div class="hero-big">${name} har reist hjem</div>
      <p class="hero-sub">${c.utfort} rampestreker på ${N} dager. Bla i dagboka for å mimre.</p>

  }

function autofill() {
  const N = totalDays();
  const used = new Set(Object.values(S.days).map(d => d.ideaId).filter(Boolean));
  const pool = allIdeas().filter(i => !used.has(i.id) && !(i.tags || []).some(t => ['start', 'slutt'].includes(t)));
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  shuffle(pool);
  const take = (pred) => { const idx = pool.findIndex(pred); if (idx < 0) return pool.shift(); return pool.splice(idx, 1)[0]; };
  let filled = 0;
  for (let n = 1; n <= N; n++) {
    if (getDay(n).title) continue;
    let idea;
    if (n === 1 && !used.has('ankomst')) idea = IDEA_BY_ID.ankomst;
    else if (n === N && !used.has('avskjed')) idea = IDEA_BY_ID.avskjed;
    else {
      const dt = dateOf(n), we = isWeekend(dt), late = n >= N - 2;
      if (late) idea = take(i => i.c === 'snill');
      else if (we) idea = take(i => i.e >= 2 || i.m >= 2);
      else if (n % 5 === 0) idea = take(i => i.c === 'snill' || i.c === 'jakt');
      else idea = take(i => i.e === 1 && i.m <= 2);
    }
    if (!idea) break;
    applyIdea(n, idea, false); filled++;
  }
  toast(filled ? `${filled} dager fikk et forslag. Bytt ut det du ikke liker.` : 'Ingen tomme dager å fylle.');
  render();
}
function applyIdea(n, idea, rerender = true) {
  const k = dayKey(n); const old = S.days[k] || {};
  S.days[k] = { ...old, ideaId: idea.id, title: idea.t, description: idea.d, materials: [...(idea.mat || [])], status: old.status && old.status !== 'tom' ? old.status : 'planlagt' };
  saveDay(n);
  if (rerender) render();
}

async function addPhotos(files) {
  const m = modalState; if (!m) return; readModalFields();
  m.d.photos = m.d.photos || [];
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    try {
      const blob = await shrinkImage(f, ASSETS ? 1600 : 900, ASSETS ? 0.85 : 0.7);
      if (ASSETS && mode === 'db') {
        toast('Laster opp bilde…');
        const r = await ASSETS.upload(blob);
        m.d.photos.push({ id: r.id });
      } else {
        if (m.d.photos.length >= 3) { toast('Maks tre bilder per dag når de lagres lokalt'); break; }
        m.d.photos.push({ data: await blobToDataUrl(blob) });
      }
    } catch (e) { console.warn(e); toast('Fikk ikke lagt til bildet. Prøv et mindre bilde.'); }
  }
  if (modalState === m) drawModal();
}
function shrinkImage(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', q); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function blobToDataUrl(b) { return new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); }); }

      <div class="card stack"><h3>Egne ting</h3>
        <form id="shopForm" class="row"><input class="input" id="shopNew" placeholder="F.eks. ekstra nissefigur" style="flex:1;min-width:0"><button class="btn green" type="submit">${ICON.plus} Legg til</button></form>
        <div class="list">${custom.map((c, i) => `<div class="shop-item"><label class="check ${c.done ? 'done' : ''}"><input type="checkbox" data-shopc="${i}" ${c.done ? 'checked' : ''}><span>${esc(c.t)}</span></label><button class="btn sm ghost" data-shopdel="${i}" aria-label="Fjern">${ICON.x}</button></div>`).join('') || '<p class="muted small">Tomt. Legg til ting som ikke hører til en bestemt dag.</p>'}</div>
        <div class="callout green small"><b>Basislager som redder mange kvelder</b><span>Mel, maskeringsteip, post-it-lapper, hyssing, whiteboardtusj, konditorfarge, marshmallows og tannpirkere.</span></div>
      </div>
    </div>
  </section>`;
};
function shopText() {
  const N = totalDays(); const seen = new Set(); const out = [];
  for (let i = 1; i <= N; i++) { const d = getDay(i); if (['utfort', 'hoppet'].includes(dayStatus(d))) continue; (d.materials || []).forEach(m => { const k = m.toLowerCase(); if (!seen.has(k) && !S.extra.shopChecked[k]) { seen.add(k); out.push('☐ ' + m); } }); }
  S.extra.shopCustom.filter(c => !c.done).forEach(c => out.push('☐ ' + c.t));
  return 'Handleliste for rampenissen\n' + (out.join('\n') || '(alt er handlet)');
}

/* ===================== Dagbok ===================== */
VIEWS.dagbok = () => {
  const N = totalDays(); const entries = [];
  for (let i = N; i >= 1; i--) { const d = getDay(i); if (dayStatus(d) === 'utfort' || d.log || (d.photos || []).length) entries.push(i); }
  const rated = entries.map(getDay).filter(d => d.rating);
  const best = rated.slice().sort((a, b) => b.rating - a.rating)[0];
  const reacts = {}; entries.forEach(i => (getDay(i).reactions || []).forEach(r => reacts[r] = (reacts[r] || 0) + 1));
  const topReact = Object.entries(reacts).sort((a, b) => b[1] - a[1])[0];
  const photos = entries.reduce((a, i) => a + (getDay(i).photos || []).length, 0);
  return `<section class="view">
    <div class="view-head"><div class="stack" style="gap:4px"><h2>Nissens dagbok</h2><p>Alt du logger blir en minnebok for desember: hva som skjedde, hva barna sa og bildene du tok.</p></div>
      ${dayNumberToday() >= 1 && dayNumberToday() <= N ? `<button class="btn primary" data-open="${dayNumberToday()}" data-tab="logg">${ICON.book} Logg dagens</button>` : ''}</div>
    <div class="stats">
      <div class="stat"><b>${entries.length}</b><span>dager logget</span></div>
      <div class="stat"><b>${photos}</b><span>bilder</span></div>
      <div class="stat"><b style="font-size:1.1rem;font-family:var(--f-body);font-weight:700;line-height:1.3">${best ? esc(best.title) : '–'}</b><span>største suksess</span></div>
      <div class="stat"><b style="font-size:1.1rem;font-family:var(--f-body);font-weight:700;line-height:1.3">${topReact ? esc(topReact[0]) : '–'}</b><span>vanligste reaksjon</span></div>
    </div>
    <div class="journal">${entries.map(i => { const d = getDay(i); return `<article class="card entry">
      <span class="mini-num">${i}</span>
      <div class="stack" style="min-width:0">
        <div class="row" style="justify-content:space-between"><div><h3>${esc(d.title || 'Uten tittel')}</h3><div class="small muted">${fmtDate(dateOf(i))}</div></div>
          <div class="row">${d.rating ? `<span class="stars" aria-label="${d.rating} stjerner">${[1, 2, 3, 4, 5].map(s => `<span style="color:${s <= d.rating ? 'var(--gold)' : 'var(--line)'};width:18px;display:inline-block">${ICON.star}</span>`).join('')}</span>` : ''}<button class="btn sm" data-open="${i}" data-tab="logg">Rediger</button></div></div>
        ${d.quote ? `<p class="quote">«${esc(d.quote.replace(/^[«"]|[»"]$/g, ''))}»</p>` : ''}
        ${d.log ? `<p>${esc(d.log)}</p>` : ''}
        ${(d.reactions || []).length ? `<div class="row">${d.reactions.map(r => `<span class="chip">${esc(r)}</span>`).join('')}</div>` : ''}
        ${(d.photos || []).length ? `<div class="photos">${d.photos.map(p => `<div class="photo"><img src="${esc(photoSrc(p))}" alt="Bilde fra dag ${i}" loading="lazy"></div>`).join('')}</div>` : ''}
        ${d.note ? `<p class="small muted">Notat: ${esc(d.note)}</p>` : ''}
      </div></article>`; }).join('') || `<div class="card empty">${ICON.book}<p>Dagboka er tom. Når nissen har gjort sin første rampestrek, åpner du luka og logger hvordan det gikk.</p><a class="btn" href="#kalender">Til kalenderen</a></div>`}</div>
  </section>`;
};

/* ===================== Brev ===================== */
const letterState = { tpl: 'ankomst', text: null };
VIEWS.brev = () => {
  const v = { kids: kidsText(), nisse: S.settings.nisseName || 'Rampenissen' };
  if (letterState.text === null) letterState.text = LETTERS[letterState.tpl].text(v);
  return `<section class="view">
    <div class="view-head"><div class="stack" style="gap:4px"><h2>Nissebrev</h2><p>Velg en mal, juster teksten og skriv den av for hånd eller kopier den. Navnene hentes fra oppsettet.</p></div></div>
    <div class="seg">${Object.entries(LETTERS).map(([k, l]) => `<button class="chip chip-toggle" data-tpl="${k}" aria-pressed="${letterState.tpl === k}">${l.name}</button>`).join('')}</div>
    <div class="grid-2">
      <div class="card stack"><label class="field"><span>Teksten</span><textarea class="input" id="letterText" style="min-height:340px">${esc(letterState.text)}</textarea></label>
        <div class="row"><button class="btn green" data-act="copyletter">${ICON.copy} Kopier</button>${inTopFrame() ? `<button class="btn" data-act="printletter">${ICON.print} Skriv ut</button>` : ''}<button class="btn ghost" data-act="resetletter">Tilbakestill malen</button></div>
        ${S.settings.kids.length ? '' : `<p class="small muted">Tips: legg inn barnas navn under <a href="#oppsett">Oppsett</a>, så settes de inn automatisk.</p>`}</div>
      <div class="letter" id="letterPreview">${esc(letterState.text)}<span class="sig">Hilsen ${esc(v.nisse)}</span></div>
    </div>
  </section>`;
};

/* ===================== Oppsett ===================== */
VIEWS.oppsett = () => {
  const s = S.settings;
  return `<section class="view">
    <div class="view-head"><div class="stack" style="gap:4px"><h2>Oppsett og tips</h2><p>Nissens navn, barna og datoene styrer resten av appen.</p></div></div>
    <div class="grid-2">
      <div class="card stack"><h3>Nissen og familien</h3>
        <div class="form-grid">
          <label class="field"><span>Nissens navn</span><input class="input" id="s-name" value="${esc(s.nisseName)}"></label>
          <label class="field"><span>Daglig påminnelse</span><input class="input" type="time" id="s-rem" value="${esc(s.reminderTime)}"></label>
          <label class="field full"><span>Barnas navn (skill med komma)</span><input class="input" id="s-kids" value="${esc(s.kids.join(', '))}" placeholder="Emma, Jonas"></label>
          <label class="field"><span>Nissen kommer</span><input class="input" type="date" id="s-start" value="${esc(s.startDate)}"></label>
          <label class="field"><span>Nissen reiser</span><input class="input" type="date" id="s-end" value="${esc(s.endDate)}"></label>
          <label class="field full"><span>Huskelapp (gjemmesteder, regler, avtaler med partner)</span><textarea class="input" id="s-notes" placeholder="Nissefiguren ligger øverst i garderobeskapet">${esc(s.notes)}</textarea></label>
        </div>
        <div class="row"><button class="btn primary" data-act="savesettings">Lagre</button></div>
      </div>
      <div class="stack">
        <div class="card stack"><h3>Gylne regler for rampenisse-foreldre</h3><ol class="tip-list">${TIPS.map(([t, d]) => `<li><div><b>${t}</b><p class="small muted">${d}</p></div></li>`).join('')}</ol></div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card stack"><h3>Lagring og deling</h3>
        <p class="small muted">${mode === 'db' ? 'Planen lagres i skyen sammen med denne siden. Del siden med partneren din som redaktør, så kan dere planlegge og logge sammen fra hver deres telefon.' : 'Planen lagres i nettleseren på denne enheten. Ta en sikkerhetskopi innimellom.'}</p>
        <div class="row"><button class="btn" data-act="export">Sikkerhetskopi</button><label class="btn">Gjenopprett fra fil<input type="file" accept=".json,application/json" id="importFile" hidden></label></div>
        <textarea class="input" id="exportBox" hidden readonly style="min-height:120px;font-family:ui-monospace,monospace;font-size:.75rem"></textarea>
        <div class="row" id="exportActions" hidden><button class="btn sm green" data-act="copyexport">${ICON.copy} Kopier</button>${DOWNLOADS || inTopFrame() ? `<button class="btn sm" data-act="downloadexport">Last ned fil</button>` : ''}</div>
      </div>
      <div class="card stack"><h3>Utseende</h3>
        <label class="check"><input type="checkbox" id="p-snow" ${prefs.snow ? 'checked' : ''}><span>Snøfall i bakgrunnen</span></label>
        <hr style="border:0;border-top:1px solid var(--line);width:100%">
        <details><summary class="danger" style="color:var(--berry)">Nullstill alt</summary>
          <div class="stack" style="margin-top:10px"><p class="small muted">Sletter alle dager, egne ideer og handlelista. Ta sikkerhetskopi først.</p>
          <label class="field"><span>Skriv NULLSTILL for å bekrefte</span><input class="input" id="resetConfirm"></label>
          <button class="btn danger" data-act="reset">Slett alt</button></div></details>
      </div>
    </div>
  </section>`;
};

/* ===================== Hendelser ===================== */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, [data-m], a, input'); if (!t) return;
  const ds = t.dataset;
  // Modal
  if (ds.m === 'backdrop' && e.target === t) { closeModal(); return; }
  if (ds.m === 'close') { e.preventDefault(); closeModal(); return; }
  if (ds.m === 'save') { saveModal(); return; }
  if (ds.m === 'clear') { const n = modalState.n; const d = S.days[dayKey(n)]; if (d && ASSETS) (d.photos || []).forEach(p => p.id && ASSETS.delete(p.id).catch(() => { })); delete S.days[dayKey(n)]; saveDay(n); closeModal(); render(); toast(`Dag ${n} er tømt`); return; }
  if (ds.m === 'pick') { readModalFields(); modalState.picking = true; drawModal(); return; }
  if (ds.m === 'unpick') { readModalFields(); modalState.picking = false; drawModal(); return; }
  if (ds.mtab) { readModalFields(); modalState.tab = ds.mtab; drawModal(); return; }
  if (ds.pickid) { const i = ideaById(ds.pickid); const d = modalState.d; Object.assign(d, { ideaId: i.id, title: i.t, description: i.d, materials: [...(i.mat || [])] }); if (!d.status || d.status === 'tom') d.status = 'planlagt'; modalState.picking = false; drawModal(); return; }
  if (ds.statusSet) { readModalFields(); modalState.d.status = ds.statusSet; drawModal(); return; }
  if (ds.rate) { readModalFields(); const r = +ds.rate; modalState.d.rating = modalState.d.rating === r ? 0 : r; if (r && modalState.d.title) modalState.d.status = 'utfort'; drawModal(); return; }
  if (ds.react) { readModalFields(); const a = modalState.d.reactions = modalState.d.reactions || []; const i = a.indexOf(ds.react); i >= 0 ? a.splice(i, 1) : a.push(ds.react); drawModal(); return; }
  if (ds.delphoto) { readModalFields(); const p = modalState.d.photos.splice(+ds.delphoto, 1)[0]; if (p && p.id && ASSETS) ASSETS.delete(p.id).catch(() => { }); drawModal(); return; }
  if (ds.assignto) { const id = $('#modalRoot').dataset.assign; const idea = ideaById(id); const n = +ds.assignto; closeModal(); applyIdea(n, idea); toast(`«${idea.t}» lagt på dag ${n}`); return; }
  // Felles
  if (ds.open) { openDay(+ds.open, ds.tab); return; }
  if (ds.mark) { const n = +ds.mark; S.days[dayKey(n)] = { ...getDay(n), status: ds.status }; saveDay(n); render(); toast('Merket som klar'); return; }
  if (ds.assign) { openAssign(ds.assign); return; }
  if (ds.fav) { const f = S.extra.favorites; const i = f.indexOf(ds.fav); i >= 0 ? f.splice(i, 1) : f.push(ds.fav); saveExtra(); render(); return; }
  if (ds.cat) { ideaFilter.cat = ds.cat; render(); return; }
  if (ds.flt) { if (ds.flt === 'effort') ideaFilter.effort = ideaFilter.effort ? 0 : 1; else ideaFilter[ds.flt] = !ideaFilter[ds.flt]; render(); return; }
  if (ds.delidea) { S.extra.customIdeas = S.extra.customIdeas.filter(i => i.id !== ds.delidea); saveExtra(); render(); toast('Ideen er slettet'); return; }
  if (ds.tpl) { letterState.tpl = ds.tpl; letterState.text = null; render(); return; }
  if (ds.shopdel) { S.extra.shopCustom.splice(+ds.shopdel, 1); saveExtra(); render(); return; }
  switch (ds.act) {
    case 'autofill': autofill(); break;
    case 'reteaser': render(); break;
    case 'random': { const used = new Set(Object.values(S.days).map(d => d.ideaId)); const pool = allIdeas().filter(i => !used.has(i.id)); const i = pool[Math.floor(Math.random() * pool.length)]; if (i) { ideaFilter.q = i.t; ideaFilter.cat = 'alle'; render(); } break; }
    case 'newidea': openNewIdea(); break;
    case 'copyshop': copyText(shopText()); break;
    case 'copyletter': copyText($('#letterText').value + '\n\nHilsen ' + (S.settings.nisseName || 'Rampenissen'), $('#letterText')); break;
    case 'printletter': window.print(); break;
    case 'resetletter': letterState.text = null; render(); break;
    case 'savesettings': saveSettingsForm(); break;
    case 'export': { const box = $('#exportBox'); box.value = JSON.stringify({ app: 'rampenisse', version: 1, exported: new Date().toISOString(), settings: S.settings, extra: S.extra, days: S.days }, null, 1); box.hidden = false; $('#exportActions').hidden = false; break; }
    case 'copyexport': copyText($('#exportBox').value, $('#exportBox')); break;
    case 'downloadexport': {
      const data = $('#exportBox').value; const filename = `rampenisse-${new Date().toISOString().slice(0, 10)}.json`;
      if (DOWNLOADS) { try { await DOWNLOADS.save({ filename, data }); } catch (err) { if (err && err.code !== 'declined') toast('Nedlasting er ikke tilgjengelig her. Bruk Kopier.'); } }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename; a.click(); }
      break; }
    case 'reset': {
      if (($('#resetConfirm').value || '').trim().toUpperCase() !== 'NULLSTILL') { toast('Skriv NULLSTILL i feltet først'); break; }
      Object.keys(S.days).forEach(k => { delete S.days[k]; saveDay(+k.slice(1)); });
      S.extra = defaultExtra(); saveExtra(); toast('Alt er nullstilt'); render(); break; }
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'pickQ') { modalState.pickQuery = e.target.value; readModalFields(); modalState.focusPick = true; drawModal(); }
  if (e.target.id === 'ideaQ') { ideaFilter.q = e.target.value; ideaFilter.focus = true; render(); }
  if (e.target.id === 'letterText') { letterState.text = e.target.value; const p = $('#letterPreview'); p.innerHTML = esc(e.target.value) + `<span class="sig">Hilsen ${esc(S.settings.nisseName || 'Rampenissen')}</span>`; }
});
document.addEventListener('change', (e) => {
  const t = e.target; const ds = t.dataset;
  if (ds.prep) { S.extra.prepChecked[ds.prep] = t.checked; saveExtra(); render(); }
  if (ds.shop !== undefined) { S.extra.shopChecked[ds.shop] = t.checked; if (!t.checked) delete S.extra.shopChecked[ds.shop]; saveExtra(); render(); }
  if (ds.shopc !== undefined) { S.extra.shopCustom[+ds.shopc].done = t.checked; saveExtra(); render(); }
  if (t.id === 'f-photo') { addPhotos([...t.files]); }
  if (t.id === 'p-snow') { prefs.snow = t.checked; lsSet(LS_PREF, prefs); snow.toggle(prefs.snow); }
  if (t.id === 'importFile' && t.files[0]) {
    const r = new FileReader(); r.onload = () => {
      try { const d = JSON.parse(r.result); if (d.app !== 'rampenisse') throw new Error('feil fil');
        Object.keys(S.days).forEach(k => { if (!(d.days || {})[k]) { delete S.days[k]; saveDay(+k.slice(1)); } });
        S.settings = { ...defaultSettings(), ...d.settings }; S.extra = { ...defaultExtra(), ...d.extra }; S.days = d.days || {};
        saveSettings(); saveExtra(); Object.keys(S.days).forEach(k => saveDay(+k.slice(1))); render(); toast('Sikkerhetskopien er gjenopprettet');
      } catch (err) { toast('Filen er ikke en sikkerhetskopi fra denne appen.'); }
    }; r.readAsText(t.files[0]);
  }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'shopForm') { const v = $('#shopNew').value.trim(); if (v) { S.extra.shopCustom.push({ t: v, done: false }); saveExtra(); render(); $('#shopNew').focus(); } }
  if (e.target.id === 'newIdeaForm') {
    const idea = { id: 'egen-' + Date.now().toString(36), c: $('#n-c').value, t: $('#n-t').value.trim(), d: $('#n-d').value.trim(), e: +$('#n-e').value, m: +$('#n-m').value, min: +$('#n-min').value || 10, mat: $('#n-mat').value.split(',').map(s => s.trim()).filter(Boolean) };
    if (!idea.t) return; S.extra.customIdeas.push(idea); saveExtra(); closeModal(); ideaFilter.cat = 'egne'; render(); toast('Ideen er lagt i idébanken');
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal(); });
function saveSettingsForm() {
  const s = S.settings; const start = $('#s-start').value, end = $('#s-end').value;
  if (start && end && parseDate(end) < parseDate(start)) { toast('Sluttdatoen må være etter startdatoen'); return; }
  s.nisseName = $('#s-name').value.trim() || 'Rampenissen'; s.kids = $('#s-kids').value.split(',').map(x => x.trim()).filter(Boolean);
  s.startDate = start || s.startDate; s.endDate = end || s.endDate; s.reminderTime = $('#s-rem').value || '21:30'; s.notes = $('#s-notes').value;
  saveSettings(); letterState.text = null; render(); toast('Oppsettet er lagret');
}

/* ===================== Snøfall ===================== */
const snow = (() => {
  const c = document.getElementById('snow'); const ctx = c.getContext('2d'); let flakes = [], raf = null, on = false;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  function size() { const r = window.devicePixelRatio || 1; c.width = innerWidth * r; c.height = innerHeight * r; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; ctx.setTransform(r, 0, 0, r, 0, 0); }
  function make() { const n = Math.min(70, Math.round(innerWidth / 18)); flakes = Array.from({ length: n }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 2.2 + .8, s: Math.random() * .5 + .25, w: Math.random() * Math.PI * 2 })); }
  function color() { return getComputedStyle(document.documentElement).getPropertyValue('--spruce').trim() || '#1f4d3f'; }
  let col = color();
  function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight); ctx.fillStyle = col; ctx.globalAlpha = .18;
    for (const f of flakes) { f.y += f.s; f.w += .01; f.x += Math.sin(f.w) * .3; if (f.y > innerHeight + 5) { f.y = -5; f.x = Math.random() * innerWidth; } ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); }
    raf = requestAnimationFrame(frame);
  }
  function toggle(v) { on = v && !reduce.matches; cancelAnimationFrame(raf); ctx.clearRect(0, 0, c.width, c.height); if (on) { col = color(); size(); make(); frame(); } }
  addEventListener('resize', () => { if (on) { size(); make(); } });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { col = color(); });
  return { toggle };
})();

/* ===================== Start ===================== */
loadLocal();
render();
snow.toggle(prefs.snow);
setSync('local');
connectCloud();
</script>
